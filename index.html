<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Desk Inbox Simulation</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    margin: 0;
  }
  #sidebar {
    width: 30%;
    background: #f1f3f6;
    border-right: 1px solid #ccc;
    overflow-y: auto;
  }
  #sidebar h2 {
    text-align: center;
    padding: 10px;
  }
  .email-item {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
  }
  .email-item:hover {
    background: #e6e9ef;
  }
  .email-subject {
    font-weight: bold;
  }
  .email-tag {
    display: inline-block;
    background: #007bff;
    color: white;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 0.7em;
    margin-left: 8px;
  }
  .priority-tag {
    display: inline-block;
    background: #ff9800;
    color: white;
    padding: 2px 5px;
    border-radius: 5px;
    font-size: 0.7em;
    margin-left: 4px;
  }
  #content {
    flex: 1;
    padding: 20px;
  }
  .actions {
    margin-top: 20px;
    border-top: 1px solid #ccc;
    padding-top: 10px;
  }
  select, button {
    margin-right: 10px;
    padding: 5px;
  }
  .saved {
    color: green;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Inbox</h2>
  <div id="email-list"></div>
</div>

<div id="content">
  <h2>Service Desk - Hochschule Bonn-Rhein-Sieg</h2>
  <div id="email-content">
    <p>Bitte wählen Sie links eine E-Mail aus, um sie zu bearbeiten.</p>
  </div>
</div>

<script>
const emails = [
  // 1 – Netzwerk / eduroam (so lassen wie besprochen)
  {
    id: 1,
    sender: "hoan.vu@smail.h-brs.de",
    subject: "Eduroam funktioniert nicht auf dem Handy",
    body:
      "Sehr geehrte Damen und Herren,<br><br>" +
      "ich konnte seit dem 13.12.2025 mit meinem Handy keine Verbindung mehr mit eduroam herstellen. " +
      "Bei jedem Verbindungsversuch erscheint ein Netzwerkfehler. Ich habe bereits überprüft, dass meine Anmeldedaten korrekt sind " +
      "und es mit meinem Laptop funktioniert.<br><br>" +
      "Matrikelnummer: hvu2s<br>" +
      "Benutzer: hoan.vu@smail.h-brs.de<br>" +
      "Netzwerkgerät: iPhone 7<br>" +
      "Betriebssystem: iOS 15<br><br>" +
      "Ich wäre Ihnen sehr dankbar, wenn Sie mir zeitnah bei der Lösung des Problems helfen könnten. Vielen Dank im Voraus für Ihre Unterstützung.<br><br>" +
      "Mit freundlichen Grüßen<br>Hoan Vu",
  },

  // 2 – Konto (Passwort/Account)
  {
    id: 2,
    sender: "lena.schmidt@smail.h-brs.de",
    subject: "Probleme mit Hochschul-Account nach Passwortänderung",
    body:
      "Guten Tag,<br><br>" +
      "ich habe gestern mein Passwort für den H-BRS-Account in MIA geändert. " +
      "Seitdem kann ich mich weder in Webmail noch im VPN-Client anmelden. In LEA funktioniert der Login aber noch.<br><br>" +
      "Können Sie prüfen, ob mein Konto eventuell gesperrt wurde oder ob die Passwortänderung noch nicht überall übernommen wurde?<br><br>" +
      "Viele Grüße<br>Lena Schmidt",
  },

  // 3 – Software (englisch, z.B. Office-Lizenz)
  {
    id: 3,
    sender: "david.nguyen@smail.h-brs.de",
    subject: "Question about Microsoft 365 license for students",
    body:
      "Dear IT support,<br><br>" +
      "I am a master student at H-BRS and I would like to use Microsoft 365 on my private laptop. " +
      "On the website I found some information about a campus license, but I am not sure which steps I need to follow to activate it.<br><br>" +
      "Do I need to register with my @smail.h-brs.de address somewhere or is there a separate portal for downloading the software?<br><br>" +
      "Best regards,<br>David Nguyen",
  },

  // 4 – Netzwerk (VPN, DRINGEND)
  {
    id: 4,
    sender: "marco.bauer@smail.h-brs.de",
    subject: "DRINGEND: Kein VPN-Zugriff für Online-Klausur",
    body:
      "Hallo Service Desk,<br><br>" +
      "ich habe morgen um 9:00 Uhr eine Online-Klausur, für die wir laut Dozent den H-BRS-VPN-Tunnel benutzen müssen. " +
      "Wenn ich den VPN-Client starte, bekomme ich jedoch immer die Meldung \"Anmeldung fehlgeschlagen\".<br><br>" +
      "Benutzername: marco.bauer@smail.h-brs.de<br>" +
      "Endgerät: Windows 11 Laptop (privat)<br><br>" +
      "Können Sie bitte prüfen, ob mein Account für VPN freigeschaltet ist oder ob es aktuell eine Störung gibt? " +
      "Die Anfrage ist relativ dringend, weil ich ohne VPN die Klausur nicht schreiben kann.<br><br>" +
      "Viele Grüße<br>Marco Bauer",
  },

  // 5 – Bewerbung (externe Adresse)
  {
    id: 5,
    sender: "sophia.krueger@example.de",
    subject: "Frage zu fehlendem Dokument im Bewerbungsportal",
    body:
      "Sehr geehrte Damen und Herren,<br><br>" +
      "ich habe mich über das Online-Portal für den Masterstudiengang Informatik an der H-BRS beworben. " +
      "Im Portal wird mir angezeigt, dass noch ein Dokument fehlt (\"Nachweis über Englischkenntnisse\"), " +
      "obwohl ich dieses bereits als PDF hochgeladen habe.<br><br>" +
      "Können Sie mir sagen, ob das Dokument bei Ihnen eingegangen ist oder ob ich es erneut hochladen muss?<br><br>" +
      "Mit freundlichen Grüßen<br>Sophia Krüger",
  },

  // 6 – Hardware (PC im Poolraum)
  {
    id: 6,
    sender: "tom.wagner@smail.h-brs.de",
    subject: "Defekter PC im Poolraum C 230",
    body:
      "Hallo IT-Team,<br><br>" +
      "im Poolraum C 230 funktioniert einer der PCs nicht mehr (Platz C230-14). " +
      "Der Rechner fährt nicht hoch, der Bildschirm bleibt schwarz und nur die Lüfter laufen. " +
      "Ich benötige den PC für eine Programmierübung im Kurs nächste Woche.<br><br>" +
      "Können Sie den Arbeitsplatz bitte prüfen oder gegebenenfalls sperren, damit andere Studierende wissen, dass er defekt ist?<br><br>" +
      "Viele Grüße<br>Tom Wagner",
  },

  // 7 – Netzwerk (englisch, instabile WLAN-Verbindung)
  {
    id: 7,
    sender: "alex.johnson@smail.h-brs.de",
    subject: "Unstable WiFi connection in library (eduroam)",
    body:
      "Dear Service Desk,<br><br>" +
      "over the last few days I have experienced very unstable WiFi (eduroam) in the Sankt Augustin library. " +
      "The connection drops every few minutes, especially in the group work area on the first floor.<br><br>" +
      "Other students around me seem to have similar issues. Could you please check if there are any known problems with the access points in this area?<br><br>" +
      "Best regards,<br>Alex Johnson",
  },

  // 8 – Sonstiges (Verlust Studierendenausweis)
  {
    id: 8,
    sender: "julia.reinhardt@smail.h-brs.de",
    subject: "Studierendenausweis verloren – wie vorgehen?",
    body:
      "Guten Tag,<br><br>" +
      "ich habe heute Morgen vermutlich meinen Studierendenausweis auf dem Campus Sankt Augustin verloren. " +
      "Mir ist bewusst, dass darüber auch die Mensa und die Drucker abgerechnet werden.<br><br>" +
      "Können Sie mir sagen, ob ich den Ausweis bei Ihnen sperren lassen muss und wo ich einen neuen beantragen kann? " +
      "Fällt für die Neuausstellung eine Gebühr an?<br><br>" +
      "Beste Grüße<br>Julia Reinhardt",
  },

    // 9 – Bewerbung, Follow-up (Problem gelöst)
  {
    id: 9,
    sender: "sophia.krueger@example.de",
    subject: "Re: Fehlendes Dokument im Bewerbungsportal – Problem gelöst",
    body:
      "Guten Tag,<br><br>" +
      "Sie können meine vorherige Anfrage zur Bewerbung ignorieren. " +
      "Ich habe gesehen, dass das Portal inzwischen den Upload des Sprachnachweises korrekt anzeigt. " +
      "Vermutlich gab es nur eine Verzögerung bei der Aktualisierung.<br><br>" +
      "Vielen Dank trotzdem und einen schönen Tag!<br><br>" +
      "Mit freundlichen Grüßen<br>Sophia Krüger",
  },


  // 10 – Software (Moodle / LEA, dringend wegen Abgabe)
  {
    id: 10,
    sender: "michael.green@smail.h-brs.de",
    subject: "Abgabe in LEA-Kurs wird nicht angezeigt (DRINGEND)",
    body:
      "Hallo Support,<br><br>" +
      "in meinem LEA-Kurs \"Projektmanagement WiSe 25/26\" sollte ich bis heute 23:59 Uhr ein PDF hochladen. " +
      "Ich habe die Datei mehrfach hochgeladen, aber die Abgabe wird im Kurs nicht als \"eingereicht\" markiert.<br><br>" +
      "Ich habe bereits einen anderen Browser ausprobiert und den Cache geleert. " +
      "Können Sie prüfen, ob es aktuell ein Problem mit LEA gibt oder ob meine Abgabe trotzdem sichtbar ist?<br><br>" +
      "Die Anfrage ist dringend, da sonst die Abgabefrist verpasst wäre.<br><br>" +
      "Viele Grüße<br>Michael Green",
  },

  // 11 – Konto (Account gesperrt nach Fehlversuchen)
  {
    id: 11,
    sender: "anna.lopez@smail.h-brs.de",
    subject: "Account gesperrt nach mehreren falschen Login-Versuchen",
    body:
      "Hallo Service Desk,<br><br>" +
      "ich habe heute mehrmals versucht, mich im Hochschul-Portal anzumelden und dabei offensichtlich ein falsches Passwort verwendet. " +
      "Jetzt erhalte ich die Meldung, dass mein Account gesperrt wurde.<br><br>" +
      "Wie lange bleibt die Sperre bestehen und können Sie meinen Account eventuell früher wieder freischalten? " +
      "Ich muss dringend mein Semesterticket herunterladen.<br><br>" +
      "Viele Grüße<br>Anna Lopez",
  }
];

const topics = ["Konto", "Netzwerk", "Hardware", "Software", "Bewerbung", "Sonstiges", "Gelöst"];

const emailListDiv = document.getElementById("email-list");
const emailContentDiv = document.getElementById("email-content");

function renderEmailList() {
  emailListDiv.innerHTML = "";
  emails.forEach(email => {
    const item = document.createElement("div");
    item.className = "email-item";
    item.onclick = () => openEmail(email);

    const subjectDiv = document.createElement("div");
    subjectDiv.className = "email-subject";
    subjectDiv.textContent = email.subject;

    if (email.topic) {
      const tag = document.createElement("span");
      tag.className = "email-tag";
      tag.textContent = email.topic;
      subjectDiv.appendChild(tag);
    }

    if (email.priority) {
      const pTag = document.createElement("span");
      pTag.className = "priority-tag";
      pTag.textContent = "P" + email.priority;
      subjectDiv.appendChild(pTag);
    }

    item.appendChild(subjectDiv);
    emailListDiv.appendChild(item);
  });
}

function openEmail(email) {
  emailContentDiv.innerHTML = `
    <h3>${email.subject}</h3>
    <p><strong>Von:</strong> ${email.sender}</p>
    <p>${email.body}</p>
    <div class="actions">
      <label>Thema: </label>
      <select id="topic-${email.id}">
        <option value="">Thema auswählen</option>
        ${topics.map(t => `<option value="${t}" ${email.topic === t ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      <label>Priorität: </label>
      <select id="priority-${email.id}">
        <option value="">Auswählen</option>
        <option value="1" ${email.priority === "1" ? "selected" : ""}>1 - Hoch</option>
        <option value="2" ${email.priority === "2" ? "selected" : ""}>2 - Normal</option>
        <option value="3" ${email.priority === "3" ? "selected" : ""}>3 - Niedrig</option>
        <option value="0" ${email.priority === "0" ? "selected" : ""}>0 - Keine</option>
      </select>
      <button onclick="saveEmail(${email.id})">Speichern</button>
      <span id="saved-${email.id}" class="saved"></span>
    </div>
  `;
}

function saveEmail(id) {
  const topic = document.getElementById(`topic-${id}`).value;
  const priority = document.getElementById(`priority-${id}`).value;
  if (!topic || !priority) {
    alert("Bitte wählen Sie sowohl ein Thema als auch eine Priorität aus, bevor Sie speichern.");
    return;
  }
  const email = emails.find(e => e.id === id);
  email.topic = topic;
  email.priority = priority;
  const savedSpan = document.getElementById(`saved-${id}`);
  savedSpan.textContent = "✓ Gespeichert!";
  setTimeout(() => {
    savedSpan.textContent = "";
  }, 1000);
  renderEmailList();
}

renderEmailList();
</script>

</body>
</html>
